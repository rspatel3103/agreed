}
@media (prefers-color-scheme: dark){

  .tiers{grid-template-columns:repeat(2,1fr)}

</style>

/* Question bank. Game codes point at these by index: only ever APPEND new questions, never reorder or delete. */

const inMode = (q, mode) => mode === "spicy" ? !!q.m : !q.m;

/* ---------- Ranking <-> index (Lehmer code over 4 options, 24 orders) ---------- */
const FACT = [6, 2, 1, 1];
function permToIdx(p){ const a=[0,1,2,3]; let idx=0; for(let i=0;i<4;i++){ const k=a.indexOf(p[i]); idx+=k*FACT[i]; a.splice(k,1);} return idx; }
function idxToPerm(idx){ const a=[0,1,2,3], p=[]; for(let i=0;i<4;i++){ const k=Math.floor(idx/FACT[i]); idx%=FACT[i]; p.push(a.splice(k,1)[0]); } return p; }

/* ---------- Game code: 7 x (question, answer), checksummed and scrambled ---------- */
const BASE = 6144; // 256 question slots x 24 answer values
function mask(c,i){ return ((Math.imul(c+17, 2654435761) ^ Math.imul(i+5, 40503)) >>> 0) % BASE; }
function encode(items){
  const v = items.map(x => x.id*24 + x.a);
  const c = v.reduce((s,x,i) => s + x*(i+3), 0) % 1296;
  let n = 0n;
  for(let i=N-1;i>=0;i--) n = n*BigInt(BASE) + BigInt((v[i] + mask(c,i)) % BASE);
  const raw = (c.toString(36).padStart(2,"0") + n.toString(36).padStart(18,"0")).toUpperCase();
  return raw.match(/.{5}/g).join("-");
}
function cleanCode(s){ return String(s||"").replace(/[^0-9a-z]/gi,"").toLowerCase(); }
function decode(s){
  const raw = cleanCode(s);
  if(raw.length !== 20) return null;
  const c = parseInt(raw.slice(0,2),36);
  let n = 0n;
  for(const ch of raw.slice(2)){ const d=parseInt(ch,36); if(isNaN(d)) return null; n = n*36n + BigInt(d); }
  const v = [];
  for(let i=0;i<N;i++){ const w=Number(n % BigInt(BASE)); n = n / BigInt(BASE); v.push((w - mask(c,i) + BASE) % BASE); }
  if(n !== 0n) return null;
  if(v.reduce((s,x,i) => s + x*(i+3), 0) % 1296 !== c) return null;
  const items = v.map(x => ({ id: Math.floor(x/24), a: x % 24 }));
  const seen = new Set();
  for(const it of items){
    const q = BANK[it.id];
    if(!q || seen.has(it.id)) return null;
    if(q.t === "s" && it.a > 4) return null;
    seen.add(it.id);
  }
  return items;
}
function pretty(s){ const r=cleanCode(s).toUpperCase(); return r.length===20 ? r.match(/.{5}/g).join("-") : r; }

/* ---------- Scoring ---------- */
// Returns tier index 0..3. Ranked: position of your pick in Siyansh's order. Scale: distance from his point.
function tierFor(item, pick){
  if(pick == null) return 3;
  const q = BANK[item.id];
  if(q.t === "r") return idxToPerm(item.a).indexOf(pick);
  return Math.min(3, Math.abs(item.a - pick));
}
function titleFor(pct){
  if(pct >= 90) return "Basically " + MASTER;
  if(pct >= 70) return "Inner circle";
  if(pct >= 50) return "Group chat regular";
  if(pct >= 30) return "Acquaintance";
  return "Have you met him?";
}

/* ---------- Storage (this device only; optional) ---------- */
function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
const memBoards = {};
function getBoard(code){ const k="agreed:board:"+cleanCode(code); return memBoards[k] || load(k, []); }
function addToBoard(code, entry){
  const k="agreed:board:"+cleanCode(code);
  const b = getBoard(code).concat([entry]).sort((x,y) => y.score - x.score);
  memBoards[k] = b; save(k, b); return b;
}

/* ---------- Helpers ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hashCode(){ const h = (location.hash||"").slice(1); return decode(h) ? pretty(h) : ""; }
function setHash(code){ try{ history.replaceState(null, "", "#" + cleanCode(code).toUpperCase()); }catch(e){ location.hash = cleanCode(code).toUpperCase(); } }
async function copy(text, toastId){
  const el = document.getElementById(toastId);
  try{ await navigator.clipboard.writeText(text); if(el) el.textContent = "Copied."; }
  catch(e){ if(el) el.textContent = "Couldn't copy. Select the text and copy it by hand."; }
}
function brand(note){
  return `<header class="brand"><span class="stamp-logo">Agreed</span><span class="brand-note">${note||""}</span></header>`;
}

/* ---------- State ---------- */
let S = { screen:"home", code: hashCode(), name:"", err:"", mode:"spicy" };
let timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function go(patch){ stopTimer(); S = Object.assign({}, S, patch); render(); window.scrollTo(0,0); }

/* ---------- Screens ---------- */
function renderHome(){
  const board = S.code ? getBoard(S.code) : [];
  return `
  ${brand("Think like " + MASTER)}
  <section class="hero">
    <h1>Pick what <span>${MASTER}</span> would pick.</h1>
    <p class="muted">${N} hot takes. ${MASTER} already locked in where he stands. The closer you get to his take, the more you score. What gets said in Agreed stays in Agreed.</p>
  </section>

  <form class="card" id="playForm" novalidate>
    <h3>Play a round</h3>
    <div class="field">
      <label for="codeIn">Game code from ${MASTER}</label>
      <input type="text" id="codeIn" class="code" autocomplete="off" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" value="${esc(S.code)}">
    </div>
    <div class="field">
      <label for="nameIn">Your name</label>
      <input type="text" id="nameIn" maxlength="24" autocomplete="nickname" placeholder="So the scoreboard knows you" value="${esc(S.name)}">
    </div>
    ${S.err ? `<p class="err" role="alert">${esc(S.err)}</p>` : ""}
    <button class="primary block" type="submit">Start</button>
  </form>

  <section class="card">
    <h3>How scoring works</h3>
    <div class="tiers">
      ${TIERS.map((t,i)=>`<div class="tier c-${t.k}"><b>${t.label}</b><span class="num">+${PTS[i]}</span></div>`).join("")}
    </div>
    <ol class="steps small">
      <li><b>Pick one</b> questions: ${MASTER} ranked all four options. His #1 is Agreed, #2 is Close, #3 is Eh, #4 is Nope.</li>
      <li><b>Agree or disagree</b> questions: ${MASTER} picked a spot on a five-step scale. Hit it exactly for Agreed; each step off drops a tier.</li>
      <li>You get ${SECS} seconds per question. Running out of time is a Nope. Max score is ${N*100}.</li>
    </ol>
  </section>

  ${board.length ? `<section class="card"><h3>Scoreboard on this device</h3>${boardList(board)}</section>` : ""}

  <section class="card gate">
    <div class="row split">
      <div>
        <h3>Are you ${MASTER}?</h3>
        <p class="muted small">Fill in your answers to set up a new round.</p>
      </div>
      <button type="button" id="hostBtn">Set up a round</button>
    </div>
  </section>`;
}
function bindHome(){
  document.getElementById("playForm").addEventListener("submit", e => {
    e.preventDefault();
    const code = document.getElementById("codeIn").value;
    const name = document.getElementById("nameIn").value.trim();
    const items = decode(code);
    if(!items){ S.code = code; S.name = name; S.err = "That code doesn't match a round. Check it with " + MASTER + " and try again."; render(); return; }
    if(!name){ S.code = pretty(code); S.name = ""; S.err = "Add your name so your score shows up on the board."; render(); document.getElementById("nameIn").focus(); return; }
    setHash(code);
    startGame(pretty(code), name, items);
  });
  document.getElementById("hostBtn").addEventListener("click", () => go({ screen:"gate", err:"" }));
}

function renderGate(){
  return `${brand("Host setup")}
  <section class="card gate">
    <h2>${MASTER} only</h2>
    <p>Everyone else, look away. On the next screen ${MASTER} answers ${N} questions. Those answers become the key for everyone who plays.</p>
    <ul class="steps small">
      <li>For <b>Pick one</b> questions, tap all four options in order, from most agree to least.</li>
      <li>For <b>Agree or disagree</b> questions, tap where you honestly land.</li>
      <li>Don't like a question? Hit <b>Swap</b> for a different one.</li>
    </ul>
    <div class="field">
      <span style="font-weight:600;font-size:14px">Question pack</span>
      <div class="row" role="radiogroup" aria-label="Question pack">
        <button class="${S.mode!=="mild"?"primary":""}" data-mode="spicy" role="radio" aria-checked="${S.mode!=="mild"}">Spicy: hot takes, dating, politics</button>
        <button class="${S.mode==="mild"?"primary":""}" data-mode="mild" role="radio" aria-checked="${S.mode==="mild"}">Mild: pizza toppings and pets</button>
      </div>
    </div>
    <div class="row"><button class="primary" id="beginHost">I'm ${MASTER}, let's go</button><button class="link" id="backHome">Back</button></div>
  </section>`;
}
function bindGate(){
  document.getElementById("beginHost").addEventListener("click", () => {
    const mode = S.mode || "spicy";
    const rIds = shuffle(BANK.map((q,i)=>i).filter(i=>BANK[i].t==="r" && inMode(BANK[i], mode))).slice(0,4);
    const sIds = shuffle(BANK.map((q,i)=>i).filter(i=>BANK[i].t==="s" && inMode(BANK[i], mode))).slice(0,3);
    const slots = shuffle(rIds.concat(sIds)).map(id => ({ id, order:[], scale:null }));
    go({ screen:"host", slots });
  });
  document.getElementById("backHome").addEventListener("click", () => go({ screen:"home" }));
  $app.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { S.mode = b.dataset.mode; render(); }));
}

function slotDone(s){ return BANK[s.id].t === "r" ? s.order.length === 4 : s.scale != null; }
function renderHost(){
  const done = S.slots.filter(slotDone).length;
  const cards = S.slots.map((s, i) => {
    const q = BANK[s.id];
    let body;
    if(q.t === "r"){
      body = `<div class="opts">${q.o.map((o, oi) => {
        const r = s.order.indexOf(oi);
        return `<button class="opt ${r>=0?"ranked":""}" data-slot="${i}" data-opt="${oi}" aria-pressed="${r>=0}"><span class="badge">${r>=0 ? r+1 : ""}</span>${esc(o)}</button>`;
      }).join("")}</div>
      <p class="hint">${s.order.length < 4 ? `Tap your ${["favorite","second pick","third pick","last pick"][s.order.length]}.` : "Ranked. Tap an option to undo from there."}</p>`;
    } else {
      body = `<div class="scale">${SCALE.map((l, li) => `<button class="${s.scale===li?"sel":""}" data-slot="${i}" data-scale="${li}" aria-pressed="${s.scale===li}">${l}</button>`).join("")}</div>`;
    }
    return `<section class="card qcard">
      <div class="qhead"><span class="chip">${i+1} of ${N} · ${q.t==="r"?"Pick one":"Agree or disagree"}</span><button class="link" data-swap="${i}">Swap</button></div>
      <p class="qtext">${esc(q.q)}</p>
      ${body}
    </section>`;
  }).join("");
  return `${brand("Host setup")}
  <section class="hero"><h2>Your answers, ${MASTER}</h2><p class="muted">Be honest. Your friends will be graded against you.</p></section>
  ${cards}
  <div class="sticky"><span class="num"><b>${done}</b> of ${N} answered</span><button class="primary" id="lockBtn" ${done<N?"disabled":""}>Lock in answers</button></div>`;
}
function bindHost(){
  $app.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => {
    const s = S.slots[+b.dataset.slot], oi = +b.dataset.opt;
    const r = s.order.indexOf(oi);
    if(r >= 0) s.order = s.order.slice(0, r);
    else { s.order.push(oi); if(s.order.length === 3) s.order.push([0,1,2,3].find(x => !s.order.includes(x))); }
    rerenderKeepScroll();
  }));
  $app.querySelectorAll("[data-scale]").forEach(b => b.addEventListener("click", () => {
    S.slots[+b.dataset.slot].scale = +b.dataset.scale; rerenderKeepScroll();
  }));
  $app.querySelectorAll("[data-swap]").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.swap, used = new Set(S.slots.map(s => s.id));
    const pool = BANK.map((q,k)=>k).filter(k => !used.has(k) && inMode(BANK[k], S.mode || "spicy"));
    S.slots[i] = { id: pool[Math.floor(Math.random()*pool.length)], order:[], scale:null };
    rerenderKeepScroll();
  }));
  document.getElementById("lockBtn").addEventListener("click", () => {
    if(S.slots.filter(slotDone).length < N) return;
    const items = S.slots.map(s => ({ id: s.id, a: BANK[s.id].t==="r" ? permToIdx(s.order) : s.scale }));
    const code = encode(items);
    setHash(code);
    go({ screen:"hostDone", code, slots:null });
  });
}
function rerenderKeepScroll(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

function inviteText(code){ return `I made an Agreed round. Think you know what I think?\nGame code: ${code}\nOpen Agreed, enter the code, and see how close you get.`; }
function renderHostDone(){
  return `${brand("Round ready")}
  <section class="card">
    <h2>Locked in</h2>
    <p>Send this code to your friends. It holds your answers in scrambled form, so nobody can read them off it.</p>
    <div class="codebox num" id="codeBox">${esc(S.code)}</div>
    <div class="row">
      <button class="primary" id="copyCode">Copy code</button>
      <button id="copyInvite">Copy invite message</button>
    </div>
    <p class="toast" id="toast" role="status"></p>
    <p class="muted small">This page's link now carries the code too. If you share the page with Share, then Copy link, players land with the code already filled in.</p>
  </section>
  <button class="link" id="homeBtn">Back to the start screen</button>`;
}
function bindHostDone(){
  document.getElementById("copyCode").addEventListener("click", () => copy(S.code, "toast"));
  document.getElementById("copyInvite").addEventListener("click", () => copy(inviteText(S.code), "toast"));
  document.getElementById("homeBtn").addEventListener("click", () => go({ screen:"home", name:"" }));
}

/* ---------- Play ---------- */
function startGame(code, name, items){
  go({ screen:"play", code, name, items, idx:0, picks:[], tiers:[], err:"", revealed:false });
  startTimer();
}
function startTimer(){
  stopTimer();
  S.deadline = Date.now() + SECS*1000;
  tick();
  timerId = setInterval(tick, 100);
}
function tick(){
  const left = Math.max(0, S.deadline - Date.now());
  const bar = document.querySelector(".timer i"), lab = document.getElementById("secs"), wrap = document.querySelector(".timer");
  if(bar) bar.style.transform = `scaleX(${left/(SECS*1000)})`;
  if(lab) lab.textContent = Math.ceil(left/1000) + "s";
  if(wrap) wrap.classList.toggle("low", left < 5000);
  if(left <= 0) answer(null);
}
function score(){ return S.tiers.reduce((s,t) => s + PTS[t], 0); }
function dots(){
  return `<div class="dots" aria-hidden="true">${Array.from({length:N}, (_, i) => {
    const t = S.tiers[i];
    return `<span class="dot ${t!=null ? "t-"+TIERS[t].k : (i===S.idx ? "now" : "")}"></span>`;
  }).join("")}</div>`;
}
function renderPlay(){
  const item = S.items[S.idx], q = BANK[item.id];
  const hud = `<div class="hud"><div><p class="muted small">${esc(S.name)} · Question ${S.idx+1} of ${N}</p>${dots()}</div><div style="text-align:right"><p class="muted small">Score</p><p class="score num">${score()}</p></div></div>`;
  if(S.revealed) return brand("Round " + esc(S.code.slice(0,5))) + hud + renderReveal(item, q);
  const opts = q.t === "r"
    ? `<div class="opts">${q.o.map((o, oi) => `<button class="pickopt" data-pick="${oi}"><kbd>${oi+1}</kbd>${esc(o)}</button>`).join("")}</div>`
    : `<div class="scale">${SCALE.map((l, li) => `<button data-pick="${li}">${l}</button>`).join("")}</div>`;
  return `${brand("Round " + esc(S.code.slice(0,5)))}
  ${hud}
  <section class="card">
    <div class="row split"><span class="chip">${q.t==="r" ? "Pick one" : "Agree or disagree"}</span><span class="num small muted" id="secs">${SECS}s</span></div>
    <div class="timer"><i></i></div>
    <p class="qtext">${q.t==="r" ? esc(q.q) : "&ldquo;" + esc(q.q) + "&rdquo;"}</p>
    <p class="hint">What does ${MASTER} think?</p>
    ${opts}
  </section>`;
}
function renderReveal(item, q){
  const pick = S.picks[S.idx], t = S.tiers[S.idx], tier = TIERS[t];
  const stampText = pick == null ? "Time's up" : tier.label;
  let detail;
  if(q.t === "r"){
    const order = idxToPerm(item.a);
    detail = `<div class="opts">${order.map((oi, r) => `<div class="rk ${oi===pick?"you":""}">
      <span class="pos c-${TIERS[r].k}">#${r+1}</span><span class="lab">${esc(q.o[oi])}</span>
      ${oi===pick ? `<span class="youtag">You</span>` : ""}<span class="pts num c-${TIERS[r].k}">+${PTS[r]}</span></div>`).join("")}</div>
      <p class="hint">${MASTER}'s full ranking, most agreed first.</p>`;
  } else {
    detail = `<div class="scale-reveal">${SCALE.map((l, li) => `<div class="${li===item.a?"his":""} ${li===pick?"mine":""}">
      <span>${l}</span><span class="tag">${li===item.a ? `<span class="c-agreed" style="color:var(--accent)">${MASTER}</span>` : ""}${li===item.a && li===pick ? " + " : ""}${li===pick ? "You" : ""}</span></div>`).join("")}</div>
      <p class="hint">${MASTER} said <b>${SCALE[item.a]}</b>.</p>`;
  }
  const last = S.idx === N-1;
  return `<section class="card result">
    <span class="verdict c-${tier.k}">${stampText}</span>
    <span class="chip" style="align-self:flex-start">+${PTS[t]} points</span>
    <p class="qtext" style="padding-right:110px">${q.t==="r" ? esc(q.q) : "&ldquo;" + esc(q.q) + "&rdquo;"}</p>
    ${detail}
    <button class="primary block" id="nextBtn">${last ? "See my results" : "Next question"}</button>
  </section>`;
}
function answer(pick){
  if(S.revealed) return;
  stopTimer();
  const item = S.items[S.idx];
  S.picks[S.idx] = pick;
  S.tiers[S.idx] = tierFor(item, pick);
  S.revealed = true;
  render();
  const nb = document.getElementById("nextBtn"); if(nb) nb.focus();
}
function bindPlay(){
  if(S.revealed){
    document.getElementById("nextBtn").addEventListener("click", () => {
      if(S.idx === N-1){
        const total = score();
        const grid = S.tiers.map(t => TIERS[t].emoji).join("");
        const board = addToBoard(S.code, { name:S.name, score: total, grid, at: Date.now() });
        go({ screen:"results", total, grid, board });
      } else {
        S.idx++; S.revealed = false; render(); startTimer(); window.scrollTo(0,0);
      }
    });
    return;
  }
  $app.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => answer(+b.dataset.pick)));
}
document.addEventListener("keydown", e => {
  if(S.screen !== "play" || S.revealed || e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  const q = BANK[S.items[S.idx].id];
  const max = q.t === "r" ? 4 : 5;
  if(n >= 1 && n <= max) answer(n-1);
});

/* ---------- Results ---------- */
function boardList(board){
  return `<ol class="board">${board.slice(0,10).map((b, i) => `<li><span class="r num">${i+1}</span><span class="n">${esc(b.name)}</span><span>${b.grid}</span><span class="s num">${b.score}</span></li>`).join("")}</ol>`;
}
function shareText(){
  const pct = Math.round(S.total / (N*100) * 100);
  return `Agreed ${S.code.slice(0,5)}\nI'm ${pct}% ${MASTER}: ${titleFor(pct)}\n${S.grid}\n${S.total}/${N*100}`;
}
function renderResults(){
  const pct = Math.round(S.total / (N*100) * 100);
  const counts = TIERS.map((t, i) => S.tiers.filter(x => x === i).length);
  return `${brand("Round " + esc(S.code.slice(0,5)))}
  <section class="card final">
    <p class="muted">${esc(S.name)}, you are</p>
    <p class="big num">${pct}%</p>
    <p class="muted">${MASTER}</p>
    <span class="title-stamp">${esc(titleFor(pct))}</span>
    <p class="grid7" aria-label="Your results by question">${S.grid}</p>
    <p class="num"><b>${S.total}</b> of ${N*100} points · ${TIERS.map((t,i) => `${counts[i]} ${t.label}`).join(" · ")}</p>
    <div class="row" style="justify-content:center">
      <button class="primary" id="shareBtn">Copy my result</button>
    </div>
    <p class="toast" id="toast" role="status"></p>
  </section>
  <section class="card">
    <h3>Scoreboard on this device</h3>
    ${boardList(S.board)}
    <p class="muted small">Passing one phone around? Hand it to the next person.</p>
    <div class="row"><button class="primary" id="nextPlayer">Next player</button><button id="homeBtn">Start screen</button></div>
  </section>`;
}
function bindResults(){
  document.getElementById("shareBtn").addEventListener("click", () => copy(shareText(), "toast"));
  document.getElementById("nextPlayer").addEventListener("click", () => go({ screen:"home", name:"", err:"" }));
  document.getElementById("homeBtn").addEventListener("click", () => go({ screen:"home", err:"" }));
}

/* ---------- Router ---------- */
function render(){
  const screens = {
    home:[renderHome, bindHome], gate:[renderGate, bindGate], host:[renderHost, bindHost],
    hostDone:[renderHostDone, bindHostDone], play:[renderPlay, bindPlay], results:[renderResults, bindResults]
  };
  const [r, b] = screens[S.screen] || screens.home;
  $app.innerHTML = r();
  b();
  if(S.screen === "play" && !S.revealed) tick();
}
window.addEventListener("hashchange", () => { if(S.screen === "home"){ S.code = hashCode() || S.code; render(); } });
render();
</script>
</body>
</html>
